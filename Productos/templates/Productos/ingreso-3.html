{% extends 'Base/base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Ingreso de Producto: {{ producto.nombre }}</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Registrar Ingreso</button>
                <a href="{% url 'ListaProducto' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
